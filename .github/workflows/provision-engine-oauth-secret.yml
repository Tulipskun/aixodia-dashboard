name: Provision Engine OAuth Secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aixodia-engine-oauth-secret-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transfer and verify server-side OAuth secret
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OAUTH_CLIENT_SECRET: ${{ secrets.DASHBOARD_GITHUB_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import hmac
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get('CF_API_TOKEN', '')
          secret = os.environ.get('OAUTH_CLIENT_SECRET', '')
          if not token or not secret:
              raise SystemExit('Required repository secret is unavailable; no KV write attempted.')

          base = 'https://api.cloudflare.com/client/v4'
          account_id = '3b953d1cbb784b3424c27798931bc37b'
          headers = {'Authorization': 'Bearer ' + token}

          def request(method, path, body=None, extra_headers=None):
              merged = dict(headers)
              if extra_headers:
                  merged.update(extra_headers)
              req = urllib.request.Request(base + path, data=body, method=method, headers=merged)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, response.read()
              except Exception as error:
                  code = getattr(error, 'code', 'network')
                  raise RuntimeError(f'Cloudflare API request failed ({code}).') from None

          status, raw = request('GET', f'/accounts/{account_id}/storage/kv/namespaces?per_page=100')
          payload = json.loads(raw)
          if status != 200 or not payload.get('success'):
              raise SystemExit('Cloudflare KV namespace discovery was rejected.')
          matches = [item for item in payload.get('result', []) if item.get('title') == 'AIXODIA_CONFIG']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one AIXODIA_CONFIG namespace; found {len(matches)}.')
          namespace_id = matches[0]['id']
          key = urllib.parse.quote('client/github_client_secret', safe='')
          path = f'/accounts/{account_id}/storage/kv/namespaces/{namespace_id}/values/{key}'

          request('PUT', path, secret.encode('utf-8'), {'Content-Type': 'text/plain; charset=utf-8'})
          status, stored = request('GET', path)
          if status != 200 or not hmac.compare_digest(stored, secret.encode('utf-8')):
              raise SystemExit('KV readback did not match the authorized source secret.')
          print('KV secret transfer verified; value was not displayed.')
          PY
