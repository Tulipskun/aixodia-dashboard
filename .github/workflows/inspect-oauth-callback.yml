name: Inspect GitHub OAuth Callback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aixodia-oauth-callback-inspection
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read registered callback URL only
        env:
          OAUTH_CLIENT_ID: Ov23lieKSrKCRs5YKwdO
          OAUTH_CLIENT_SECRET: ${{ secrets.DASHBOARD_GITHUB_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          client_id = os.environ.get('OAUTH_CLIENT_ID', '')
          secret = os.environ.get('OAUTH_CLIENT_SECRET', '')
          if not client_id or not secret:
              raise SystemExit('OAuth app credentials unavailable.')
          basic = base64.b64encode(f'{client_id}:{secret}'.encode()).decode()
          req = urllib.request.Request(
              f'https://api.github.com/applications/{client_id}',
              headers={
                  'Authorization': 'Basic ' + basic,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'aixodia-oauth-callback-inspector',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.loads(response.read())
          except urllib.error.HTTPError as error:
              raise SystemExit(f'GitHub OAuth App metadata request failed: HTTP {error.code}.') from None
          callback = payload.get('callback_url')
          if not isinstance(callback, str) or not callback:
              raise SystemExit('GitHub did not return a callback URL.')
          print('Registered GitHub OAuth callback URL: ' + callback)
          PY
