name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*'
      - 'README.md'
      - '.env.example'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aixodia-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

      - name: Discover Cloudflare account and Pages project
        id: cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          token = os.environ.get('CF_API_TOKEN', '')
          if not token:
              raise SystemExit('CLOUDFLARE_API_TOKEN repository secret is missing.')
          base = 'https://api.cloudflare.com/client/v4'
          def get(path):
              req = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'Cloudflare API request failed with HTTP {error.code}; check token permissions.') from None
              if not payload.get('success'):
                  raise SystemExit('Cloudflare API rejected the request; check token permissions.')
              return payload.get('result', [])
          zones = get('/zones?name=aixodia.dpdns.org&per_page=100')
          if len(zones) != 1:
              raise SystemExit(f'Expected one aixodia.dpdns.org zone; found {len(zones)}.')
          account_id = zones[0]['account']['id']
          projects = get(f'/accounts/{account_id}/pages/projects')
          exists = any(project.get('name') == 'aixodia-dashboard' for project in projects)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'account_id={account_id}\nproject_exists={str(exists).lower()}\n')
          print(f'Cloudflare account and Pages project state verified; project_exists={exists}.')
          PY

      - name: Create static Pages project
        if: steps.cloudflare.outputs.project_exists != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: npx --yes wrangler@4.160.0 pages project create aixodia-dashboard --production-branch main

      - name: Deploy static Dashboard to Pages preview hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: npx --yes wrangler@4.160.0 pages deploy dist --project-name aixodia-dashboard --branch main

      - name: Verify Pages deployment before custom-domain cutover
        run: |
          python3 - <<'PY'
          import re, time, urllib.request
          base = 'https://aixodia-dashboard.pages.dev/'
          required = ['github.com/login/oauth/authorize', 'code_challenge_method', 'S256', '/v1/auth/github/exchange']
          last_error = None
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(base, timeout=20) as response:
                      html = response.read().decode()
                  assets = re.findall(r'(?:src|href)="([^"]+\.js)"', html)
                  if not assets:
                      raise RuntimeError('Pages preview HTML has no JavaScript asset.')
                  url = assets[0] if assets[0].startswith('http') else base + assets[0].lstrip('/')
                  with urllib.request.urlopen(url, timeout=20) as response:
                      bundle = response.read().decode()
                  missing = [marker for marker in required if marker not in bundle]
                  if missing:
                      raise RuntimeError('Pages preview is stale; missing markers: ' + ', '.join(missing))
                  if 'device_code' in bundle or 'Paste a token' in bundle:
                      raise RuntimeError('Obsolete Device Flow/PAT UI remains in Pages preview.')
                  print('Static Pages deployment is serving the current PKCE bundle.')
                  break
              except Exception as error:
                  last_error = error
                  if attempt == 23:
                      raise SystemExit(f'Pages preview verification failed: {last_error}')
                  time.sleep(5)
          PY
