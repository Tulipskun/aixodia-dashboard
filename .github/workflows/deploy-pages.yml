name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*'
      - 'README.md'
      - '.env.example'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aixodia-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

      - name: Inspect existing Cloudflare hosting topology
        id: cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          token = os.environ.get('CF_API_TOKEN', '')
          if not token:
              raise SystemExit('CLOUDFLARE_API_TOKEN repository secret is missing.')
          base = 'https://api.cloudflare.com/client/v4'
          def get(path, optional=False):
              req = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  if optional:
                      print(f'Optional metadata endpoint returned HTTP {error.code}: {path}')
                      return []
                  raise SystemExit(f'Cloudflare API request failed with HTTP {error.code}; check token permissions.') from None
              if not payload.get('success'):
                  if optional:
                      print(f'Optional metadata endpoint unavailable: {path}')
                      return []
                  raise SystemExit('Cloudflare API rejected the request; check token permissions.')
              return payload.get('result', [])
          accounts = get('/accounts?per_page=100')
          pages_matches = []
          for account in accounts:
              account_id = account['id']
              print(f"Cloudflare account: {account.get('name', 'unnamed')} ({account_id})")
              projects = get(f'/accounts/{account_id}/pages/projects', optional=True)
              for project in projects:
                  domains = project.get('domains') or []
                  print(f"Pages project: {project.get('name')} domains={','.join(domains)}")
                  if 'dashboard.aixodia.dpdns.org' in domains:
                      pages_matches.append((account_id, project['name']))
              scripts = get(f'/accounts/{account_id}/workers/scripts', optional=True)
              for script in scripts:
                  print(f"Worker script: {script.get('id') or script.get('script')}")
          zones = get('/zones?name=aixodia.dpdns.org&per_page=100', optional=True)
          for zone in zones:
              zone_id = zone['id']
              print(f"Zone: {zone.get('name')} ({zone_id})")
              for route in get(f'/zones/{zone_id}/workers/routes', optional=True):
                  print(f"Worker route: pattern={route.get('pattern')} script={route.get('script')}")
              for record in get(f"/zones/{zone_id}/dns_records?name=dashboard.aixodia.dpdns.org&per_page=100", optional=True):
                  print(f"Dashboard DNS: type={record.get('type')} name={record.get('name')} content={record.get('content')} proxied={record.get('proxied')}")
          if len(pages_matches) == 1:
              account_id, project_name = pages_matches[0]
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(f'account_id={account_id}\nproject_name={project_name}\n')
              print(f'Found Pages project bound to production domain: {project_name}.')
          else:
              print(f'No unique Pages project bound to dashboard.aixodia.dpdns.org (matches={len(pages_matches)}).')
          PY

      - name: Deploy static Dashboard to production
        if: steps.cloudflare.outputs.project_name != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
          CF_PROJECT_NAME: ${{ steps.cloudflare.outputs.project_name }}
        run: npx --yes wrangler@4.160.0 pages deploy dist --project-name "$CF_PROJECT_NAME" --branch main

      - name: Verify production serves the current PKCE bundle
        if: steps.cloudflare.outputs.project_name != ''
        run: |
          python3 - <<'PY'
          import re, time, urllib.request
          required = ['github.com/login/oauth/authorize', 'code_challenge_method', 'S256', '/v1/auth/github/exchange']
          last_error = None
          for attempt in range(24):
              try:
                  with urllib.request.urlopen('https://dashboard.aixodia.dpdns.org/', timeout=20) as response:
                      html = response.read().decode()
                  assets = re.findall(r'(?:src|href)="([^"]+\.js)"', html)
                  if not assets:
                      raise RuntimeError('Production HTML has no JavaScript asset.')
                  url = assets[0] if assets[0].startswith('http') else 'https://dashboard.aixodia.dpdns.org/' + assets[0].lstrip('/')
                  with urllib.request.urlopen(url, timeout=20) as response:
                      bundle = response.read().decode()
                  missing = [marker for marker in required if marker not in bundle]
                  if missing:
                      raise RuntimeError('Production bundle is stale; missing markers: ' + ', '.join(missing))
                  if 'device_code' in bundle or 'Paste a token' in bundle:
                      raise RuntimeError('Obsolete Device Flow/PAT UI remains in production.')
                  print('Production Dashboard serves the current GitHub PKCE bundle.')
                  break
              except Exception as error:
                  last_error = error
                  if attempt == 23:
                      raise SystemExit(f'Production verification failed: {last_error}')
                  time.sleep(5)
          PY
