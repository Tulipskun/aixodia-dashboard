"$schema" = "./node_modules/wrangler/config-schema.json"

# ---- Cloudflare Pages (static dist/ + Pages Functions in functions/) ----
# Pages commands do NOT accept a custom --config path: they auto-detect the
# root wrangler.toml / wrangler.jsonc. The Workers config lives separately in
# wrangler.worker.toml and is always passed explicitly with --config.
name = "aixodia-dashboard"
compatibility_date = "2026-11-07"
pages_build_output_dir = "./dist"

# Non-secret configuration (same values as wrangler.worker.toml).
[vars]
MCP_BASE_URL = "https://mcp.aixodia.dpdns.org"
SESSION_TTL_SEC = "28800"
SESSION_VERSION = "1"

# Pages secrets are a SEPARATE store from Workers secrets — set both:
#   npm run secrets:worker   (wrangler secret put ... --config wrangler.worker.toml)
#   npm run secrets:pages    (wrangler pages secret put ... --project-name aixodia-dashboard)
# For local `wrangler pages dev`, copy .dev.vars.example -> .dev.vars.
# NEVER commit .dev.vars or put credentials in [vars].
