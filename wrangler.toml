name = "aixodia-dashboard"
main = "worker/index.js"
compatibility_date = "2026-11-07"

[[d1_databases]]
binding = "DB"
database_name = "aixodia-dashboard"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
ALLOWED_GITHUB_USERS = "Tulipskun"
APP_ORIGIN = "https://dashboard.aixodia.dpdns.org"

[[routes]]
pattern = "dashboard.aixodia.dpdns.org/*"
zone_name = "aixodia.dpdns.org"
