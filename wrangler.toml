name = "aixodia-dashboard"
main = "worker/index.js"
compatibility_date = "2026-11-07"

[[d1_databases]]
binding = "DB"
database_name = "aixodia"
database_id = "e8e746ea-691e-43bf-9fe2-c4e4016f29a1"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "DEVICE_TUNNELS"
id = "9c094dd95b96473085eaaa625aefc383"

[[services]]
binding = "MCP_GATEWAY"
service = "aixodia-mcp-gateway"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/sso/*"]

[vars]
ALLOWED_GITHUB_USERS = "Tulipskun"
APP_ORIGIN = "https://dashboard.aixodia.dpdns.org"

[[routes]]
pattern = "dashboard.aixodia.dpdns.org/*"
zone_name = "aixodia.dpdns.org"
