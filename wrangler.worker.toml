"$schema" = "./node_modules/wrangler/config-schema.json"

# ---- Cloudflare Workers (static assets + one Worker for /api/*) ----
name = "aixodia-dashboard"
main = "worker/index.js"
compatibility_date = "2026-11-07"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# Non-secret configuration. NEVER put tokens here (vars are plain text in git).
[vars]
MCP_BASE_URL = "https://mcp.aixodia.dpdns.org"
SESSION_TTL_SEC = "28800"
SESSION_VERSION = "1"

# Set from the remote machine with: npm run secrets:worker
# (values are piped into `wrangler secret put` via stdin, never printed/logged)
[secrets]
required = [
  "SESSION_SECRET",
  "AUTH_USERNAME",
  "AUTH_PASSWORD_HASH",
  "CF_ACCESS_CLIENT_ID",
  "CF_ACCESS_CLIENT_SECRET",
]

[observability]
enabled = true

# Build the Vite bundle automatically before deploy / dev.
[build]
command = "npm run build"
