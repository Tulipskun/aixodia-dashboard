"$schema" = "./node_modules/wrangler/config-schema.json"

# ---- Cloudflare Workers (static assets + one Worker for /api/*) ----
name = "aixodia-dashboard"
main = "worker/index.js"
compatibility_date = "2026-11-07"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# Set with: wrangler secret put GH_TOKEN --config wrangler.worker.toml
# For local dev put it in .dev.vars (see .dev.vars.example).
[secrets]
required = ["GH_TOKEN"]

[observability]
enabled = true

# Build the Vite bundle automatically before deploy / dev.
[build]
command = "npm run build"
